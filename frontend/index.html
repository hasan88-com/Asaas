<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asaasa · اثاثہ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Screen loader — shown while React boots */
      #screen-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F6F4ED;
        transition: opacity 0.3s ease-out;
      }
      #screen-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #screen-loader img {
        width: 120px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <!-- Screen loader -->
    <div id="screen-loader">
      <img src="/src/assets/loader.gif" alt="Loading" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loader when React app mounts
      window.addEventListener('load', function() {
        var loader = document.getElementById('screen-loader');
        if (loader) {
          setTimeout(function() {
            loader.classList.add('fade-out');
            setTimeout(function() { loader.remove(); }, 300);
          }, 500);
        }
      });
    </script>
  </body>
</html>
