[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Run tests on the same session-scoped loop as the async fixtures. Without this,
# tests default to a per-function loop while db_session lives on the session loop,
# so the fixture finalizer (engine.dispose) runs against a closed loop
# ("Future attached to a different loop") and asyncpg connections leak.
asyncio_default_test_loop_scope = session
